[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "launchpoint"
version = "0.5.0"
description = "Controller-Origin Finder — estimate a drone operator's location from ground-position sightings via Monte-Carlo viewshed intersection."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Giorgi Samukashvili" }]
keywords = [
    "drone", "uav", "counter-drone", "counter-uav", "drone-detection",
    "geolocation", "operator-localization", "remote-id",
    "viewshed", "line-of-sight", "raycasting", "monte-carlo",
    "geospatial", "gis", "dsm", "dem", "elevation", "raster",
    "copernicus", "openstreetmap", "canopy-height",
    "cuda", "gpu",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "shapely>=2.0",
    "geopandas>=0.13",
    "numba>=0.58",
    "requests>=2.28",
]

[project.optional-dependencies]
# The CUDA viewshed uses numba.cuda, which needs the maintained numba-cuda
# target plus the CUDA 12 toolkit wheels (NVVM + cudart) it JITs against. The
# [cu12] extra pulls those in and auto-discovers them inside a plain venv — the
# bundled numba.cuda target does not find pip-installed CUDA on Windows.
gpu = ["numba-cuda[cu12]>=0.30"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
launchpoint = "launchpoint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"launchpoint.ui" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require live network access to keyless data sources (deselected by default)",
    "slow: long-running tests",
]
addopts = "-m 'not network' --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"
